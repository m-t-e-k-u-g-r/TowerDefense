name: TowerDefense
services:
  database:
    image: postgres:18.0
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U $$DB_USER -d $$DATABASE"]
      interval: 2s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/docker

volumes:
  data: